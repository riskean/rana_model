version: rana_inference_harness_v001
identity: rana_person
dataset_version: rana_dataset_v003
reference_bank: rana_reference_bank_v001
expression_conditioning: rana_expression_conditioning_v001

defaults:
  identity_reference: neutral_front
  expression: neutral
  view: front
  pose_control: off
  depth_control: off

prompt_resolution:
  rana_person:
    identity_reference: neutral_front
  smiling:
    expression_preset: smiling
  pout:
    expression_preset: pout
  wink_smile:
    expression_preset: wink_smile
  eyes_closed:
    expression_preset: eyes_closed
  looking_up:
    expression_preset: looking_up
  looking_down:
    expression_preset: looking_down

separation:
  identity:
    source: face_focused_reference
    may_define:
      - facial_identity
      - facial_proportions
    must_not_define:
      - hijab
      - clothing
      - background
      - pose
      - expression
  expression:
    source: expression_region_reference
    must_not_define:
      - identity
      - hijab
      - clothing
      - background
  wardrobe:
    source: prompt_or_garment_condition
  body:
    source: pose_depth_condition
    role: geometry

regression:
  fixed_seeds: [101, 202, 303, 404, 505, 606, 707, 808]
  unseen_seeds: [909, 1001, 1102, 1203]
  validation_in_fitting: false
  holdout_in_fitting: false

acceptance:
  required:
    - identity_stability
    - subject_specific_expression
    - body_proportion_stability
    - head_body_proportion_stability
    - hijab_independence
    - clothing_independence
    - view_robustness
    - lighting_robustness
    - camera_robustness
  optional_later:
    - temporal_consistency
